
<h1>Operation</h1>

<fusio-message [response]="response"></fusio-message>

<fusio-search
  [searchTerm]="search"
  (search)="doSearch(1, $event)"
  (newClick)="router.navigate(getNewLink())"
  placeholder="/acme/endpoint"
  helpPath="api/operation/">
</fusio-search>
<table class="table table-striped">
  <thead>
  <tr>
    <th style="width:10%">Status</th>
    <th style="width:30%">Name</th>
    <th style="width:50px;">Method</th>
    <th style="width:30%">Path</th>
    <th style="width:30%">Action</th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let entry of entries">
    <td class="fusio-operation-status-cell">
      <span class="fusio-operation-status-icons" role="group" [attr.aria-label]="'Active: ' + (entry.active === true ? 'yes' : 'no') + ', Public: ' + (entry.public === true ? 'yes' : 'no') + ', Usability: ' + (entry.usability === 1 ? 'external' : 'internal')">
        <i
          class="bi fusio-operation-status-icon"
          [ngClass]="entry.active === true ? 'bi-lightbulb-fill text-success' : 'bi-lightbulb-off text-secondary'"
          [attr.title]="entry.active === true ? 'Active' : 'Inactive'"
          role="img"></i>
        <i
          class="bi fusio-operation-status-icon"
          [ngClass]="entry.public === true ? 'bi-eye-fill text-primary' : 'bi-shield-lock-fill text-secondary'"
          [attr.title]="entry.public === true ? 'Public' : 'Private'"
          role="img"></i>
        <i
          class="bi fusio-operation-status-icon"
          [ngClass]="entry.usability === 1 ? 'bi-box-arrow-up-right text-dark' : 'bi-house-door-fill text-secondary'"
          [attr.title]="entry.usability === 1 ? 'External — user center JWT' : 'Internal — Fusio token & scopes'"
          role="img"></i>
      </span>
    </td>
    <td><code>{{entry.name}}</code></td>
    <td><span class="badge text-bg-dark fusio-operation-http-method me-1">{{entry.httpMethod}}</span></td>
    <td><code class="fusio-operation-http-path"><a href="{{baseUrl}}{{entry.httpPath}}">{{entry.httpPath}}</a></code></td>
    <td><app-action-link [data]="entry.action"></app-action-link></td>
    <td>
      <div class="btn-group" role="group">
        <a [routerLink]="getDetailLink(entry.id)" class="btn btn-primary"><i class="bi bi-search"></i></a>
        <a [routerLink]="getEditLink(entry.id)" class="btn btn-secondary"><i class="bi bi-pen"></i></a>
        <a [routerLink]="getDeleteLink(entry.id)" class="btn btn-danger"><i class="bi bi-x"></i></a>
      </div>
    </td>
  </tr>
  </tbody>
</table>
<ngb-pagination
  [(page)]="page"
  [pageSize]="pageSize"
  [collectionSize]="totalResults"
  [maxSize]="4"
  [ellipses]="false"
  (pageChange)="doSearch($event)"></ngb-pagination>


<app-instance *ngIf="!hasUrl"></app-instance>

<app-navigation *ngIf="hasActiveInstance || hasUrl" [hasInstance]="!hasUrl"></app-navigation>

<div class="fusio-container" [ngClass]="{'fusio-container-instance': !hasUrl}" *ngIf="hasActiveInstance || hasUrl">
  <div class="container-fluid">
    <div class="row">
      <div class="col">
        <div class="fusio-header-toolbar" *ngIf="hasActiveInstance || hasUrl">
          <div ngbDropdown class="fusio-header-profile" *ngIf="user">
            <button type="button" class="btn" id="userMenu" ngbDropdownToggle>{{ user.name }} <i class="bi bi-person"></i></button>
            <div ngbDropdownMenu aria-labelledby="userMenu">
              <button ngbDropdownItem routerLink="{{ item.path }}" *ngFor="let item of menu">{{ item.title }}</button>
            </div>
          </div>
          <div class="form-check form-switch fusio-theme-switch">
            <label class="form-check-label fusio-theme-switch-label mb-0 d-inline-flex align-items-center gap-2" [title]="darkMode ? 'Dark theme' : 'Light theme'">
              <input
                class="form-check-input m-0"
                type="checkbox"
                [(ngModel)]="darkMode"
                (ngModelChange)="setDarkMode($event)"
                [attr.aria-label]="darkMode ? 'Switch to light theme' : 'Switch to dark theme'">
              <span class="visually-hidden">Color theme</span>
              <i class="bi" [ngClass]="darkMode ? 'bi-moon-stars-fill' : 'bi-sun-fill'" aria-hidden="true"></i>
            </label>
          </div>
        </div>
        <div class="fusio-content">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
